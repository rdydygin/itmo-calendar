services:
  calendar:
    build: .
    restart: unless-stopped
    env_file: isu.env
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      CALENDAR_DOMAIN: ${CALENDAR_DOMAIN:?Set CALENDAR_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
